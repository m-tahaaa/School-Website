{% extends 'base.html' %}
{% block title %}Notice Board | Lakhipur Middle School{% endblock %}
{% block content %}
<main class="paper-grid"><div class="mx-auto max-w-5xl px-5 py-16 lg:px-8"><div class="max-w-2xl"><div class="text-xs font-bold uppercase tracking-[.22em] text-royal">Stay in the know</div><h1 class="display mt-4 text-5xl font-bold">Notice board</h1><p class="mt-5 text-lg leading-8 text-slate-600">Important circulars, exam updates, holidays, and school life in one place.</p></div><form class="mt-10 grid gap-3 sm:grid-cols-[1fr_180px_auto]" hx-get="{% url 'school:notices' %}" hx-target="#notice-list" hx-trigger="keyup changed delay:300ms, change" hx-push-url="true"><input type="search" name="q" value="{{ query }}" placeholder="Search notices..." aria-label="Search notices"><select name="category" aria-label="Filter by category"><option value="">All categories</option><option value="general" {% if selected_category == 'general' %}selected{% endif %}>General</option><option value="exam" {% if selected_category == 'exam' %}selected{% endif %}>Exam</option><option value="sports" {% if selected_category == 'sports' %}selected{% endif %}>Sports</option><option value="holiday" {% if selected_category == 'holiday' %}selected{% endif %}>Holiday</option></select><button class="rounded-xl bg-royal px-5 py-3 font-bold text-white" type="submit">Filter</button></form><div id="notice-list" class="mt-8">{% include 'partials/notice_list.html' %}</div></div></main>
{% endblock %}
