<div class="grid gap-4">{% for notice in notices %}<article class="lift rounded-2xl bg-white p-6 shadow-sm"><div class="flex flex-wrap items-center justify-between gap-3"><div class="flex items-center gap-3"><span class="rounded-full bg-blue-50 px-3 py-1 text-xs font-bold uppercase tracking-wider text-royal">{{ notice.get_category_display }}</span>{% if notice.is_pinned %}<span class="text-xs font-bold text-amber-600">Pinned</span>{% endif %}</div><time class="text-xs font-medium text-slate-400" datetime="{{ notice.date_posted|date:'Y-m-d' }}">{{ notice.date_posted|date:'d M Y' }}</time></div><h2 class="display mt-4 text-2xl font-bold">{{ notice.title }}</h2><p class="mt-3 whitespace-pre-line text-sm leading-7 text-slate-600">{{ notice.content }}</p></article>{% empty %}<div class="rounded-2xl border border-dashed border-slate-300 bg-white/60 px-6 py-14 text-center"><div class="display text-xl font-bold">No notices found</div><p class="mt-2 text-sm text-slate-500">Try another search or check back soon.</p></div>{% endfor %}</div>
